version: "3.9"

services:

  db:
    image: postgres:16
    container_name: cdi_food_db
    environment:
      POSTGRES_USER: cdi
      POSTGRES_PASSWORD: cdi_pass
      POSTGRES_DB: cdi_food_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/models/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdi -d cdi_food_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: cdi_food_api
    environment:
      DATABASE_URL: postgresql+psycopg2://cdi:cdi_pass@db:5432/cdi_food_db
      SECRET_KEY: change_this_in_production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: